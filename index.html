<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Varga Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">VARGA</p>
      <h1>Hub</h1>
    </div>
    <span class="badge" id="appCount">0 app</span>
  </header>

  <main>
    <section class="hero">
      <h2>Tutte le tue app in un solo posto</h2>
      <p>Tocca una scheda per aprire l’app oppure modificarla con ChatGPT.</p>
      <label class="search-wrap" aria-label="Cerca app">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Cerca un’app…" autocomplete="off">
      </label>
    </section>

    <section id="appsGrid" class="apps-grid" aria-live="polite"></section>
    <p id="emptyState" class="empty" hidden>Nessuna app trovata.</p>
  </main>

  <template id="appCardTemplate">
    <article class="app-card" tabindex="0" role="button" aria-expanded="false">
      <div class="app-main">
        <div class="app-icon" aria-hidden="true"></div>
        <div class="app-copy">
          <h3 class="app-name"></h3>
          <p class="app-desc"></p>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </div>
      <div class="actions" hidden>
        <button class="action primary open-app" type="button">🚀 Apri app</button>
        <button class="action secondary edit-app" type="button">✏️ Modifica con ChatGPT</button>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
